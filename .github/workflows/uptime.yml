# Surveillance du site : toutes les 30 min, GitHub vérifie que le site répond
# et que la base est joignable (/health). En cas d'échec, le workflow échoue
# → GitHub envoie un email de notification au propriétaire du dépôt.
name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site accessible (HTTPS)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://henocmukumbi.com)
          echo "home → HTTP $code"
          [ "$code" = "200" ]

      - name: Base de données joignable (/health)
        run: |
          body=$(curl -sS --max-time 20 https://henocmukumbi.com/health)
          echo "health → $body"
          echo "$body" | grep -q '"ok":true'

      - name: Certificat valide encore 14 jours
        run: |
          exp=$(echo | openssl s_client -connect henocmukumbi.com:443 -servername henocmukumbi.com 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          exp_s=$(date -d "$exp" +%s); now_s=$(date +%s)
          days=$(( (exp_s - now_s) / 86400 ))
          echo "certificat expire dans $days jours"
          [ "$days" -ge 14 ]
